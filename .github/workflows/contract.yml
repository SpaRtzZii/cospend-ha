name: Tests de contrat (Nextcloud + Cospend)

# Lancé à la demande et chaque semaine : démarre un vrai serveur Nextcloud avec Cospend.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

env:
  PYTHON_VERSION: "3.13"
  COSPEND_TEST_URL: http://localhost:8080
  COSPEND_TEST_USER: admin
  COSPEND_TEST_PASSWORD: admin-test-password

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e "lib/aiocospend[test]"
      - name: Démarrer Nextcloud
        run: docker compose -f dev/docker-compose.yml up -d
      - name: Installer Cospend
        run: ./dev/setup-nextcloud.sh
      - name: Tests de contrat
        run: pytest -m contract
      - name: Arrêter Nextcloud
        if: always()
        run: docker compose -f dev/docker-compose.yml down -v
