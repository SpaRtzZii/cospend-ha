name: Publication

# À la publication d'une release : compile la carte, fixe la version du manifeste et
# joint cospend.zip (contenu de custom_components/cospend) à la release, comme l'attend HACS.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/cospend_card/package-lock.json

      - name: Compiler la carte
        working-directory: src/cospend_card
        run: |
          npm ci
          npm run build

      - name: Fixer la version du manifeste
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/cospend/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/cospend/manifest.json

      - name: Créer l'archive
        run: |
          cd custom_components/cospend
          zip -r ../../cospend.zip . -x "www/.gitkeep"

      - name: Joindre l'archive à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" cospend.zip --clobber
