name: CI

on:
  push:
  pull_request:

env:
  # À aligner sur la version de Python requise par Home Assistant
  # (voir les prérequis de pytest-homeassistant-custom-component).
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  lib:
    name: Tests du client aiocospend (sans Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e "lib/aiocospend[test]"
      - run: pytest lib/aiocospend/tests

  integration:
    name: Tests de l'intégration (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-test.txt
      - run: pytest tests/components

  card:
    name: Carte (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cospend_card
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/cospend_card/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
