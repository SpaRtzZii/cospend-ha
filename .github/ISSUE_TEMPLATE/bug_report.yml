name: Bug report / Signaler un bug
description: Something does not work as expected / Quelque chose ne fonctionne pas
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens? / Que se passe-t-il ?
      description: Steps to reproduce, what you expected / Étapes pour reproduire, résultat attendu
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: cospend-ha, Home Assistant, Nextcloud, Cospend
      placeholder: "cospend-ha 1.0.0, HA 2026.11, Nextcloud 33, Cospend 3.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Journaux
      description: Home Assistant log lines mentioning `cospend`, and browser console errors for card problems. Remove tokens, passwords and private addresses. / Retirez jetons, mots de passe et adresses privées.
      render: text
