[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["aiocospend", "custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["lib/aiocospend/tests", "tests"]
markers = [
    "contract: tests exécutés contre un vrai serveur Nextcloud + Cospend (variables COSPEND_TEST_*)",
]
